# Server Configuration
server.port=${PORT:8080}

# Load local environment file if present
spring.config.import=optional:file:.env[.properties]

# Database Configuration (PostgreSQL / Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://db.ggbuxhwzzatrmxcwgqev.supabase.co:5432/postgres?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize schema and seed data on startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# H2 Console (disabled when using MySQL)
spring.h2.console.enabled=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ElectroMartSecretKey2026ElectroMartSecretKey2026ElectroMartSecretKey2026}
app.jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://electro-mart-three.vercel.app,https://*.vercel.app}

# Logging
logging.level.com.electromart=DEBUG
logging.level.org.springframework.security=DEBUG
